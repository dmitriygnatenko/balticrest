news:
  text: 了解最新消息
  link: 轉到新聞
top:
  header: 波羅的海沿岸旅遊指南！
  text: 該網站將向加里寧格勒地區的客人和居民介紹一些有趣的地方，供您放鬆身心，並在波羅的海度過一個難忘的周末。
before_news:
  text: 我們邀請您結識波羅的海沿岸加里寧格勒地區異常，美麗，健康的俄羅斯地區！
slider:
  sl1:
    header: 旅遊地圖
    text: 選擇您喜歡的咖啡館和餐館。如果您對貨幣兌換或其他銀行服務感興趣，則可以在步行範圍內輕鬆找到銀行和自動櫃員機。對於駕車旅行的人，地圖上將顯示付費和免費停車。
    btn: 斯韋特洛戈爾斯克地圖
  sl2:
    header: 響應式設計
    text: 在智能手機，平板電腦上查看網站非常方便。
  sl3:
    header: 在哪裡睡覺？
    text: 如果您正在尋找一家旅館，我們的網站將幫助您選擇最合適的旅館。
    btn: 酒店斯韋特洛戈爾斯克
features:
  header: 我們幫助遊客
  f1:
    header: 酒店和療養院
    text: 以旅行社最優惠的價格預訂酒店和度假村，在地圖​​上選擇離大海或景點更近的酒店。
  f2:
    header: 咖啡館，比薩店，餐館
    text: 我們的地圖將向您介紹有關歐洲，亞洲和俄羅斯美食的咖啡館，比薩餅店和餐館。
  f3:
    header: 停車場
    text: 在地圖上找到最方便的免費或付費停車位，並將您的車停在安全的地方。
  f4:
    header: 博物館與地標
    text: 客人可以了解該地區的歷史，參觀不尋常的博物館，例如“捕鼠器”（Mousetrap），這是一個專門研究老鼠的博物館。
  f5:
    header: 新聞
    text: 您可以提前計劃假期，以了解在不久的將來將舉行哪些音樂會和慶祝活動。
  f6:
    header: 網絡攝像頭
    text: 實時在線查看木板路和大海。