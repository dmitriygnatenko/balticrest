map:
    text: Посмотрите все самое интересное на карте
    btn: Карта
category:
    text: Мы знаем многие интересные места в городах
news:
    text: Узнайте последние новости
    link: Перейти к новостям
top:
    header: Туристический справочник Балтийского побережья!
    text: Гостям и жителям Калининградской области сайт расскажет об интересных местах для отдыха и проведения незабываемых выходных на Балтийском море.
before_news:
    text: Приглашаем вас познакомиться с необычным, красивым, оздоровительным российским регионом на берегу Балтийского моря – Калининградской областью!
slider:
    sl1:
        header: Туристическая карта
        text: Выбирайте кафе и рестораны по своему вкусу. Если вас интересует обмен валюты или другие банковские услуги, то вы сможете легко найти в шаговой доступности от вас банки и банкоматы. Для путешествующих на машине карта покажет платные и бесплатные парковки.
        btn: Карта Светлогорска
    sl2:
        header: Адаптивный дизайн
        text: Удобно просматривать сайт на смартфонах, планшетах.
    sl3:
        header: Где переночевать?
        text: Если вы в поисках отеля или гостиницы, наш сайт поможет выбрать самый подходящий.
        btn: Отели Светлогорска
features:
    header: Мы помогаем туристам
    f1:
        header: Отели и санатории
        text: Бронируйте отели и санатории по лучшим ценам туроператора, выбирайте отели на карте ближе к морю или достопримечательностями.
    f2:
        header: Кафе, пиццерии, рестораны
        text: Наши карты расскажут о кафе, пиццериях и ресторанах с европейской, азиатской и русской кухней.
    f3:
        header: Парковки
        text: Найдите на карте наиболее удобную бесплатную или платную парковку и оставляйте свою машину в безопасном месте.
    f4:
        header: Музеи и достопримечательности
        text: Гости могут познакомиться с историей региона, посетить необычные музеи, например "Мышеловка" - музей, посвященный мышкам.
    f5:
        header: Новости
        text: Вы можете планировать свой отдых, заранее зная, какие концерты и праздники будут проходить в ближайшее время.
    f6:
        header: Веб-камеры
        text: Посмотрите на променад и море он-лайн в реальном времени.