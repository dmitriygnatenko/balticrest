login:
    title: 'Вход'
    desc: 'Вход в туристический справочник Балтийского побережья'
    keywords: 'вход, авторизация'

restore:
    title: 'Восстановление пароля'
    desc: 'Восстановление пароля в туристическом справочнике Балтийского побережья'
    keywords: 'восстановление пароля, вход'

index:
    title: 'Туристический справочник Балтийского побережья'
    desc: 'Калининградская область приглашает провести отдых на море. Отели и санатории, гостиницы и кафе на карте городов Калининградской области'
    keywords: 'отдых на море, Калининградская область, карта, санатории, отели, гостиницы, магазины, кафе, рестораны, музеи, спорт, банки, банкоматы, погода, вокзалы, расписание, электричка, новости'

map:
    default:
        title: 'Туристический справочник Балтийского побережья - карта %city_gen%'
        desc: '%city% в Калининградской области приглашает провести отдых на море. Отели и санатории %city_gen%, прекрасные гостиницы %city_gen% на карте городов Калининградской области'
        keywords: '%city%, отдых на море, Калининградская область, карта, санатории, отели, гостиницы, магазины, кафе, рестораны, музеи, спорт, банки, банкоматы, погода, вокзалы, расписание, электричка, новости'
    hotels:
        title: 'Отели и гостиницы %city_gen% на карте'
        desc: 'Отели %city_gen% на карте. %city% в Калининградской области приглашает отдохнуть в отели и гостиницы на берегу моря. Туристическая карта %city_gen% - ваш лучший гид.'
        keywords: '%city%, карта, отели, гостиницы, гостевые дома, Калининградской области, отдых, услуги, Балтийское море, погода'
    medicine:
        title: 'Санатории и пансионаты %city_gen% на карте'
        desc: 'Санатории и пансионаты %city_gen%, которые предлагают отдых и лечение на берегу Балтийского моря.'
        keywords: '%city%, карта, санатории, пансионаты, где, Калининградская, отдых, услуги, оздоровительный, Балтийское, море, заболевания, лечение, погода'
    cafes:
        title: 'Кафе, рестораны, пиццерии и бары %city_gen% на карте'
        desc: 'Популярные кафе %city_gen% на карте, лучшие рестораны и бары.'
        keywords: '%city%, карта, кафе, рестораны, бары, пиццерии'
    shops:
        title: 'Магазины %city_gen% на карте'
        desc: 'Магазины %city_gen% на карте. Найдите самый близкий и удобный для вас магазин в городе.'
        keywords: '%city%, карта, магазины, покупки, супермаркет'
    banks:
        title: 'Банки и банкоматы %city_gen% на карте'
        desc: 'Ближайшие банки и банкоматы %city_gen%, которые совершают обмен валюты, прием платежей, открытие и ведение банковских счетов, операции с драгметаллами и монетами на карте.'
        keywords: '%city%, карта, банки, банкоматы, деньги'
    museums:
        title: 'Достопримечательности %city_gen% на карте'
        desc: 'Карта %city_gen% с достопримечательностями. Достопримечательности с описанием, где можно провести выходные в Калининградской области.'
        keywords: '%city%, карта, достопримечательности, музеи'
    sport:
        title: 'Спортивные объекты %city_gen% на карте'
        desc: 'Спортивные объекты %city_gen%. Спорткомплексы, бассейны, спортивные площадки и многое другое. Все для поддержания спортивной фигуры и бодрого настроения.'
        keywords: '%city%, карта, спорт, футбол, фитнес'
    transport:
        title: 'Парковки, вокзалы %city_gen% на карте'
        desc: 'Парковки, вокзалы %city_gen%. Узнайте как пройти с вокзала до моря.'
        keywords: '%city%, карта, вокзалы, автобус, парковки, электричка, пригородные, поезда'

list:
    hotels:
        title: 'Отели и гостиницы %city_gen%'
        desc: 'Отели %city_gen% на карте. %city% в Калининградской области приглашает отдохнуть в отели и гостиницы на берегу моря. Туристическая карта %city_gen% - ваш лучший гид.'
        keywords: '%city%, карта, отели, гостиницы, гостевые дома, Калининградской области, отдых, услуги, Балтийское море, погода'